name: Bug 反馈
description: 在使用 Nori Desktop Pet 的过程中遇到了问题或程序异常。
title: "【Bug】（将此栏【替换】为你的简要问题描述）"
labels: ["Bug", "待查看", "优先级：无"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您进行 Bug 反馈。请在上面的文本框⬆️起一个能够清晰描述您的问题的标题，便于开发者高效定位与解决您的问题。
        
        > [!important]
        > 重要：如果要提出**多个 Bug**，请为每一个 Bug 开一个单独的 issue。
        >
        > 如果您不知道如何有效、精准地表述，我们建议您先阅读《提问的智慧》（[链接](https://github.com/ryanhanwu/How-To-Ask-Questions-The-Smart-Way/blob/main/README-zh_CN.md)）。
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      description: 在开始反馈这个问题之前，请先检查：
      options:
        - label: 我已更新到最新版 ![最新的版本号](https://img.shields.io/github/v/release/MF-Dust/Nori-Desktop-Pet?include_prereleases&style=flat-square&label=) 或 ![最新的版本号](https://img.shields.io/github/v/release/MF-Dust/Nori-Desktop-Pet?style=flat-square&label=) 测试，并看过 [最新提交](https://github.com/MF-Dust/Nori-Desktop-Pet/commits/main/)，确认这一 Bug 还没有修复。我也已在 [Issues](https://github.com/MF-Dust/Nori-Desktop-Pet/issues?q=type%3ABug) 中检索，确认这一 Bug 未被提交过，并且在 [DeepWiki 知识库与常见问题](https://deepwiki.ai/MF-Dust/Nori-Desktop-Pet) 中没有相关解决方案。
          required: true
        - label: 我已经仔细阅读过选项里的内容，并且知道这个选项不用勾选。
        - label: 我已知晓并同意，此处仅用于汇报程序中存在的问题（关于交流讨论、模型制作、使用咨询等应当在 Discussion 板块提出）。
          required: true
  - type: markdown
    attributes:
      value: |
        ### Bug 信息

        描述您遇到的 Bug。您可以附上截图、录屏、堆栈跟踪、日志文件等材料，便于开发者追踪问题。**日志文件位于安装包根目录 `data/diagnostics/logs/`；若使用发布包，请在 `<PackageRoot>/data/diagnostics/logs/` 查找。**

        > [!note]
        > 上传附件时**请优先使用 GitHub 的附件系统上传附件**，将需要上传的附件粘贴或拖动到撰写区域即可上传。多个日志或崩溃文件可打包为 zip 格式后上传。**尽量避免使用需要登录或安装客户端才能接收附件的网盘（如\*度网盘、\*克网盘、1\*3网盘等）上传附件**，以避免开发者因不具有对应网盘客户端或账户而延误问题诊断。
  - type: textarea
    id: expected
    attributes:
      label: 期望的行为
      description: 详细描述你期望发生的正常行为，突出与目前异常行为的不同。
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 实际结果
      description: 实际发生的问题现象或异常行为。
    validations:
      required: true
  - type: textarea
    id: reproduce-steps
    attributes:
      label: 重现步骤
      description: |
        详细描述要怎么操作才能再次触发这个 Bug。
      placeholder: |
        1. 启动 Nori 客户端……
        2. 点击…… / 切换模型到……
        3. 出现异常……
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏（可选，强烈建议）
      description: |
        如果可能，请直接将截图或录屏拖动/粘贴到此处，便于开发者直观理解问题。
  - type: textarea
    id: stacktrace
    attributes:
      label: 崩溃日志 / 堆栈跟踪（可选）
      description: 如果遇到闪退、崩溃弹窗或程序报错，请将控制台日志、堆栈跟踪信息或 `<PackageRoot>/data/diagnostics/logs/` 中的错误日志粘贴在此处。
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: 运行环境与诊断信息
      description: |
        请提供您的运行环境信息，有助于快速复现环境特定问题：
        - 操作系统版本（如 Windows 11 23H2 / Windows 10 22H2）
        - Nori 客户端版本（可在应用设置或关于中查看）
        - WebView2 运行时版本
        - 使用的 Live2D 模型名称（默认 Nori / 导入的自定义模型）
        - 显卡与图形驱动（如集成显卡 / NVIDIA / AMD）
      placeholder: |
        - 操作系统：Windows 11 专业版 23H2
        - Nori 版本：Dev 或发布页中的完整版本
        - WebView2 运行时：已安装最新版
        - 模型：默认 Nori 模型
        - 显卡：NVIDIA RTX 4060
    validations:
      required: true
  - type: checkboxes
    id: revision
    attributes:
      label: 最后一步
      description: 回顾您的回答
      options:
        - label: 我认为上述的描述已经足够详细，以允许开发人员能复现该问题。如果我的 issue 没有按照上述的要求填写，可能会被无条件关闭。
          required: true
