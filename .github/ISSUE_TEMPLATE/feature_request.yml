name: 功能请求
description: 提出一项新的功能或交互改进。
title: "【功能】（将此栏【替换】为你的标题）"
labels: ["新功能", "待查看", "优先级：无"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您贡献您的想法。
        请使用简洁明确的标题描述您希望增加或改进的功能，便于开发者了解您的想法。
        
        > [!important]
        > 重要：如果您想要提出 **多项功能**，请为每一个功能开一个单独的 issue。
        >
        > 在提出功能请求前，建议先查阅 [README.md](https://github.com/MF-Dust/Nori-Desktop-Pet#readme) 与 [开发规范及任务清单](https://github.com/MF-Dust/Nori-Desktop-Pet/tree/main/docs)。
        >
        > 由于开发者时间精力有限，提交的功能请求可能需要一定时间进行评估、设计与排期实现。
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      description: 在开始反馈这个问题之前，请先检查：
      options:
        - label: 我已将本应用更新到最新版或测试版 ![最新的版本号](https://img.shields.io/github/v/release/MF-Dust/Nori-Desktop-Pet?include_prereleases&style=flat-square&label=)，并看过 [最新提交](https://github.com/MF-Dust/Nori-Desktop-Pet/commits/main/)，确认我想要的功能还没有实现。我也已在 [Issues](https://github.com/MF-Dust/Nori-Desktop-Pet/issues?q=-label%3ABug) 和 [DeepWiki 知识库](https://deepwiki.ai/MF-Dust/Nori-Desktop-Pet) 中检索，确认我想要的功能未被提交过。
          required: true
        - label: 我已确认该需求与 Nori Desktop 的核心功能相关（Live2D 伴侣交互 / AI 伴侣 / 记忆 / 声音 / 工具扩展等）。若需求属于定制化工具能力，可优先考虑通过 MCP (Model Context Protocol) 插件机制进行扩展。
          required: true
        - label: 我已经仔细阅读过选项里的内容，并且知道这个选项不用勾选。
        - label: 我已知晓由于开发者时间精力有限，提交的功能请求可能需要一定时间进行评估与排期实现。
          required: true
  - type: markdown
    attributes:
      value: |
        > [!note]
        > 上传附件时**请优先使用 GitHub 的附件系统上传附件**，将需要上传的附件（原型图、设计稿、参考视频等）粘贴或拖动到撰写区域即可上传。多个文件可打包为 zip 格式后上传。**尽量避免使用需要登录或安装客户端才能接收附件的网盘（如\*度网盘、\*克网盘、1\*3网盘等）上传附件**，以避免开发者因不具有对应网盘客户端或账户而延误评估。
  - type: textarea
    id: back
    attributes:
      label: 背景与动机
      description: 为什么你认为需要此功能？这个功能对你和其他用户有多重要？
    validations:
      required: true
  - type: textarea
    id: requested-feature
    attributes:
      label: 想要实现或优化的功能
      description: 详细地描述一下你想要的功能，联系到哪些已经存在的功能（如有），描述的越具体，采纳的可能性越高。
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: 期望效果
      description: 请详细描述这个功能实现后的具体交互与视觉效果。
      placeholder: |
        例如：开启设置面板中【XX开关】后，Nori 在受到XX事件触发时会做出XX动作，并在控制台显示XX……
    validations:
      required: true
  - type: checkboxes
    id: revision
    attributes:
      label: 最后一步
      description: 回顾您的回答
      options:
        - label: 我认为上述的描述已经足以详细，以便开发人员理解您想要的功能。如果我的 issue 没有按照上述的要求填写，可能会被无条件关闭。
          required: true
