name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            rid: win-x64

          - os: ubuntu-latest
            name: linux
            rid: linux-x64

          - os: macos-15
            name: macos
            rid: osx-arm64

    defaults:
      run:
        working-directory: app/desktop

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 安装 Linux 原生编译依赖
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          alsa=libasound2
          if apt-cache show libasound2t64 >/dev/null 2>&1; then alsa=libasound2t64; fi
          sudo apt-get install -y libgtk-3-0 "$alsa" libgl1-mesa-dri dbus

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        if: matrix.name == 'linux'
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: ${{ matrix.name == 'linux' && 'pnpm' || '' }}
          cache-dependency-path: app/desktop/pnpm-lock.yaml

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      # NuGet 全局包缓存: 键随 csproj/构建口径变化, 前缀兜底让依赖变更时只下载增量。
      - name: 缓存 NuGet 全局包
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/desktop/**/*.csproj', 'app/desktop/Directory.Build.props', 'app/desktop/version.props', 'app/desktop/Nori.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: 安装主题检查依赖
        if: matrix.name == 'linux'
        run: pnpm install --frozen-lockfile

      - name: 主题令牌门 · 静态检查
        if: matrix.name == 'linux'
        run: pnpm lint

      - name: 主题令牌门 · 类型检查
        if: matrix.name == 'linux'
        run: pnpm build

      - name: 主题令牌门 · 单元测试
        if: matrix.name == 'linux'
        run: pnpm test

      # 不把 build/test/publish 合并成并行 matrix 或后台任务, 避免共享 obj 文件锁。
      - name: 准备 UniDesktop 原生库
        run: node scripts/prepare-unidesktop.mjs ${{ matrix.rid }}

      - name: 后端门 · 构建
        run: dotnet build Nori.slnx --configuration Release

      # Desktop 宿主测试包含短生命周期异步任务；限制 MSBuild 并行度，避免多个测试项目同时争用 runner 调度。
      - name: 后端门 · 单元测试
        run: dotnet test Nori.slnx --configuration Release --no-build --no-restore -m:1

      - name: 发布目标还原
        run: dotnet restore Nori.Desktop/Nori.Desktop.csproj --runtime ${{ matrix.rid }}

      - name: Linux / macOS 槽式 FDD 发布
        if: matrix.name != 'windows'
        run: |
          chmod +x publish.sh
          NORI_SKIP_FRONTEND=1 NORI_KEEP_SYMBOLS=0 ./publish.sh "${{ matrix.rid }}"

      - name: Windows 槽式 FDD 发布
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $env:NORI_SKIP_FRONTEND = "1"
          $env:NORI_PRODUCT_VERSION = "Dev"
          $env:NORI_DEPLOYMENT_REVISION = "0"
          cmd /c publish.bat
          if (-not (Test-Path "bin/publish/win-x64/Nori.exe")) { throw "缺少稳定根入口 Nori.exe" }
          if (-not (Test-Path "bin/publish/win-x64/.current")) { throw "缺少 .current" }

      - name: 上传 CI 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nori-${{ matrix.rid }}-ci-package
          path: app/desktop/bin/publish/${{ matrix.rid }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
