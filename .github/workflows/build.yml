name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CI 门禁: first-party TODO/FIXME 扫描 + pnpm lint/build/test/coverage + dotnet build/test/coverage。
# 每个 job 内的 dotnet 调用严格串行;
# Windows 另做 FDD 发布、ZIP 内容与双启动分支冒烟。
# Linux / macOS 做 FDD 发布并上传 publish 产物。
jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            rid: win-x64

          - os: ubuntu-latest
            name: linux
            rid: linux-x64

          - os: macos-14
            name: macos
            rid: osx-arm64

    defaults:
      run:
        working-directory: app/desktop

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 安装 Linux 原生编译依赖
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      # NuGet 全局包缓存: 键随 csproj/构建口径变化, 前缀兜底让依赖变更时只下载增量。
      - name: 缓存 NuGet 全局包
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/desktop/**/*.csproj', 'app/desktop/Directory.Build.props', 'app/desktop/version.props', 'app/desktop/Nori.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 一方 TODO/FIXME 门禁
        if: matrix.name == 'windows'
        run: pnpm check:todo

      # ESLint 与平台无关，只在 Windows 门禁 job 跑一次，避免三平台重复消耗。
      - name: 前端门 · 静态检查
        if: matrix.name == 'windows'
        run: pnpm lint

      - name: 前端门 · 类型检查与构建
        run: pnpm build

      # Windows 的覆盖率命令已执行全量测试，无需重复跑普通测试。
      - name: 前端门 · 单元测试
        if: matrix.name != 'windows'
        run: pnpm test

      - name: 前端门 · 覆盖率与阈值
        if: matrix.name == 'windows'
        run: pnpm coverage

      - name: 上传前端覆盖率产物
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nori-frontend-coverage
          path: app/desktop/coverage/*
          if-no-files-found: error
          retention-days: 7

      - name: 脚本门 · 发布结构 fixture
        if: matrix.name == 'windows'
        run: node scripts/validate-publish-structure.test.mjs

      - name: 脚本门 · 自动更新清单 fixture
        if: matrix.name == 'windows'
        run: node scripts/generate-update-manifest.test.mjs

      # 不把 build/test/publish 合并成并行 matrix 或后台任务, 避免共享 obj 文件锁。
      - name: 后端门 · 构建
        run: dotnet build Nori.slnx --configuration Release

      # Desktop 宿主测试包含短生命周期异步任务；限制 MSBuild 并行度，避免多个测试项目同时争用 runner 调度。
      - name: 后端门 · 单元测试
        if: matrix.name != 'windows'
        run: dotnet test Nori.slnx --configuration Release --no-build --no-restore -m:1

      # Windows 的其余三个测试项目由覆盖率步骤完整执行；启动器没有覆盖率收集器。
      - name: 后端门 · Windows 启动器单元测试
        if: matrix.name == 'windows'
        run: dotnet test Nori.AppLauncher.Tests/Nori.AppLauncher.Tests.csproj --configuration Release --no-build --no-restore -m:1

      # 复用 Release 构建，在同一轮执行 Core、Desktop、PluginRuntime 全量测试并收集覆盖率。
      - name: 后端门 · 覆盖率产物
        if: matrix.name == 'windows'
        run: pnpm coverage:dotnet --no-build --no-restore

      - name: 上传 .NET 覆盖率产物
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nori-dotnet-coverage
          path: app/desktop/artifacts/dotnet-coverage/**
          if-no-files-found: error
          retention-days: 7

      # -----------------------------------------------------------------------
      # Linux / macOS
      # -----------------------------------------------------------------------

      - name: Linux / macOS 发布目标还原
        if: matrix.name != 'windows'
        run: dotnet restore Nori.Desktop/Nori.Desktop.csproj --runtime ${{ matrix.rid }}

      - name: Linux / macOS 槽式 FDD 发布
        if: matrix.name != 'windows'
        run: |
          chmod +x publish.sh
          NORI_SKIP_FRONTEND=1 NORI_KEEP_SYMBOLS=0 ./publish.sh "${{ matrix.rid }}"

      - name: 上传 Linux / macOS CI 产物
        if: matrix.name != 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nori-${{ matrix.rid }}-ci-package
          path: app/desktop/bin/publish/${{ matrix.rid }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # -----------------------------------------------------------------------
      # Windows
      # -----------------------------------------------------------------------

      - name: Windows 发布目标还原
        if: matrix.name == 'windows'
        run: dotnet restore Nori.Desktop/Nori.Desktop.csproj --runtime win-x64

      - name: Windows 槽式 FDD 发布
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $env:NORI_SKIP_FRONTEND = "1"
          $env:NORI_PRODUCT_VERSION = "Dev"
          $env:NORI_DEPLOYMENT_REVISION = "0"
          cmd /c publish.bat
          if (-not (Test-Path "bin/publish/win-x64/Nori.exe")) { throw "缺少稳定根入口 Nori.exe" }
          if (-not (Test-Path "bin/publish/win-x64/.current")) { throw "缺少 .current" }

      - name: Windows ZIP / SBOM / notices 内容冒烟
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 `
            -PublishDir bin/publish/win-x64 `
            -Version Dev `
            -OutputDir bin/ci-release

      - name: Windows first-run 启动冒烟
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "nori-smoke-first-run-$env:GITHUB_RUN_ID"
          $expectedVersion = "Dev"

          ./scripts/smoke-published.ps1 `
            -BinaryPath bin/publish/win-x64/Nori.exe `
            -Mode first-run `
            -Profile $profile `
            -ExpectedVersion $expectedVersion

      - name: Windows initialized 启动冒烟
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "nori-smoke-initialized-$env:GITHUB_RUN_ID"
          $expectedVersion = "Dev"

          ./scripts/smoke-published.ps1 `
            -BinaryPath bin/publish/win-x64/Nori.exe `
            -Mode initialized `
            -Profile $profile `
            -ExpectedVersion $expectedVersion

      - name: Windows safe-mode 启动冒烟
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "nori-smoke-safe-mode-$env:GITHUB_RUN_ID"
          $expectedVersion = "Dev"

          ./scripts/smoke-published.ps1 `
            -BinaryPath bin/publish/win-x64/Nori.exe `
            -Mode initialized `
            -Profile $profile `
            -ExpectedVersion $expectedVersion `
            -SafeMode

      - name: 上传 Windows CI 产物
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nori-windows-ci-package
          path: app/desktop/bin/ci-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
