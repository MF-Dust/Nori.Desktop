name: issue-30-31-agent-patch

on:
  push:
    branches: [fix/issues-30-31]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-30-31
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python .github/issue-30-31-patch.py

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install frontend dependencies
        working-directory: app/desktop
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        working-directory: app/desktop
        run: |
          pnpm lint
          pnpm build
          pnpm test

      - name: Backend checks
        working-directory: app/desktop
        run: |
          dotnet build Nori.slnx --configuration Release
          dotnet test Nori.slnx --configuration Release --no-build --no-restore -m:1

      - name: Commit verified patch and remove temporary helpers
        run: |
          git rm .github/workflows/issue-30-31-agent.yml .github/issue-30-31-patch.py
          git add app/desktop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: resolve recurring reminders and Live2D scaling"
          git push origin HEAD:fix/issues-30-31
