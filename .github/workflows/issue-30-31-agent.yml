name: issue-30-31-agent-patch

on:
  push:
    branches: [fix/issues-30-31]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-30-31
          fetch-depth: 0

      - name: Apply deterministic source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def read_text(path: Path):
              raw = path.read_bytes()
              bom = raw.startswith(b'\xef\xbb\xbf')
              return raw.decode('utf-8-sig' if bom else 'utf-8'), bom

          def write_text(path: Path, text: str, bom: bool):
              raw = text.encode('utf-8')
              if bom:
                  raw = b'\xef\xbb\xbf' + raw
              path.write_bytes(raw)

          def replace_count(rel: str, old: str, new: str, expected: int = 1):
              path = ROOT / rel
              text, bom = read_text(path)
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{rel}: expected {expected} occurrences, found {actual}: {old!r}')
              text = text.replace(old, new)
              write_text(path, text, bom)

          def delete_between(rel: str, start: str, end: str):
              path = ROOT / rel
              text, bom = read_text(path)
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f'{rel}: delete markers are not unique')
              left = text.index(start)
              right = text.index(end, left)
              text = text[:left] + text[right:]
              write_text(path, text, bom)

          # Issue #31: one canonical size control, 4x display size and 4x render resolution.
          replace_count(
              'app/desktop/src/components/settings/AdjustControls.vue',
              '\t\t\t\t\t:max="2"',
              '\t\t\t\t\t:max="4"',
          )

          behavior = 'app/desktop/src/components/settings/Live2dBehaviorControls.vue'
          replace_count(behavior, 'const modelScale = ref(1)\n', '')
          replace_count(
              behavior,
              'onError: (key, error) => feedback.error(key === "modelScale" ? I18N.value.scaleSaveFailed : I18N.value.saveFailed, error),',
              'onError: (_key, error) => feedback.error(I18N.value.saveFailed, error),',
          )
          replace_count(behavior, '\t\tmodelScale.value = META.scale\n', '')
          replace_count(
              behavior,
              'const onModelScaleUpdate = (value: number) => {\n\tmodelScale.value = value\n\tSAVE.save("modelScale", () => RUNTIME.setModelDisplay(props.modelId, {scale: value}))\n}\n\n',
              '',
          )
          delete_between(
              behavior,
              '\n\t\t<div class="surface-inset flex flex-col gap-1.5 px-[1.1rem] py-2">\n\t\t\t<span class="text-base font-500 text-text-primary">{{ I18N.modelScale }}</span>',
              '\n\t\t<div class="surface-inset flex flex-col gap-1.5 px-[1.1rem] py-2">\n\t\t\t<span class="text-base font-500 text-text-primary">{{ I18N.renderScale }}</span>',
          )
          replace_count(behavior, '\t\t\t\t\t:max="2"', '\t\t\t\t\t:max="4"')

          replace_count(
              'app/desktop/src/services/i18n/locales/zh-CN.ts',
              'renderScaleDesc: "0.5x ~ 2x, 越高越清晰但更耗性能"',
              'renderScaleDesc: "0.5x ~ 4x, 越高越清晰但更耗性能"',
          )
          replace_count(
              'app/desktop/src/services/i18n/locales/en-US.ts',
              'renderScaleDesc: "0.5x to 2x, higher is sharper but costs more performance"',
              'renderScaleDesc: "0.5x to 4x, higher is sharper but costs more performance"',
          )
          replace_count(
              'app/desktop/src/services/live2d/index.ts',
              'inner.userScale = clamp(scale, 0.1, 2)',
              'inner.userScale = clamp(scale, 0.1, 4)',
          )
          replace_count(
              'app/desktop/Nori.Desktop/Live2D/PetRuntime.cs',
              'Math.Clamp(userScale, 0.1f, 2.0f)',
              'Math.Clamp(userScale, 0.1f, 4.0f)',
          )
          replace_count(
              'app/desktop/Nori.Desktop/Live2D/PetRuntime.cs',
              'Math.Clamp(scale, 0.1f, 2.0f)',
              'Math.Clamp(scale, 0.1f, 4.0f)',
          )
          replace_count(
              'app/desktop/Nori.Desktop/Bridge/BridgeCommands.cs',
              'ReadFiniteNumber(scaleElem, "模型缩放", 0.1f, 2.0f)',
              'ReadFiniteNumber(scaleElem, "模型缩放", 0.1f, 4.0f)',
          )
          replace_count(
              'app/desktop/Nori.Core/Live2D/Live2DRenderSettings.cs',
              'public const float MaxRenderScale = 2.0f;',
              'public const float MaxRenderScale = 4.0f;',
          )

          sizing = 'app/desktop/Nori.Core/Live2D/PetSizing.cs'
          replace_count(
              sizing,
              '窗口尺寸 = 安全基准 x userScale，并按屏幕尺寸 85% 保护收口。',
              '窗口尺寸 = 安全基准 x userScale，并允许扩展到工作区 200%，让高倍缩放仍保留完整模型区域。',
          )
          replace_count(
              sizing,
              'Math.Clamp(double.IsFinite(userScale) && userScale > 0 ? userScale : 1.0, 0.1, 2.0)',
              'Math.Clamp(double.IsFinite(userScale) && userScale > 0 ? userScale : 1.0, 0.1, 4.0)',
          )
          replace_count(sizing, 'screenW * scaleFactor * 0.85', 'screenW * scaleFactor * 2.0')
          replace_count(sizing, 'screenH * scaleFactor * 0.85', 'screenH * scaleFactor * 2.0')

          # Issue #30: expose the existing daily recurrence backend in the proactive settings UI.
          proactive = 'app/desktop/src/components/settings/ProactiveSettings.vue'
          replace_count(
              proactive,
              'const customMinutesInput = ref<number | null>(null)\n',
              'const customMinutesInput = ref<number | null>(null)\nconst repeatDaily = ref(false)\n',
          )
          replace_count(
              proactive,
              '\ttry {\n\t\tawait RUNTIME.reminderAdd(newReminderText.value.trim(), effectiveDelayMinutes.value)\n\t\tawait RUNTIME.refresh()\n\t\tnewReminderText.value = ""\n\t\tselectedPreset.value = 15\n\t\tcustomMinutesInput.value = null\n\t\tvalidationError.value = ""\n',
              '\ttry {\n\t\tconst CREATED = await RUNTIME.reminderAdd(newReminderText.value.trim(), effectiveDelayMinutes.value)\n\t\tif (repeatDaily.value) {\n\t\t\ttry {\n\t\t\t\tawait RUNTIME.reminderUpdate({id: CREATED.id, repeatDaily: true})\n\t\t\t} catch (error) {\n\t\t\t\ttry { await RUNTIME.reminderCancel(CREATED.id) } catch { /* 保持原始更新异常 */ }\n\t\t\t\tthrow error\n\t\t\t}\n\t\t}\n\t\tawait RUNTIME.refresh()\n\t\tnewReminderText.value = ""\n\t\tselectedPreset.value = 15\n\t\tcustomMinutesInput.value = null\n\t\trepeatDaily.value = false\n\t\tvalidationError.value = ""\n',
          )
          replace_count(
              proactive,
              '\n\t\t\t\t\t<!-- 错误校验提示 -->',
              '\n\t\t\t\t\t<AppSwitchRow\n\t\t\t\t\t\t:title="TEXT.reminders.badgeDaily"\n\t\t\t\t\t\t:model-value="repeatDaily"\n\t\t\t\t\t\t:disabled="isSafeMode || isAdding"\n\t\t\t\t\t\t@update:model-value="repeatDaily = $event"\n\t\t\t\t\t/>\n\n\t\t\t\t\t<!-- 错误校验提示 -->',
          )

          # Regression tests for both changes.
          controller_test = 'app/desktop/tests/live2d/controller-mount.test.ts'
          replace_count(
              controller_test,
              '\t\texpect(currentModel.scale.set).toHaveBeenLastCalledWith(0.1, 0.1)\n\n\t\tawait CONTROLLER.destroy()\n',
              '\t\texpect(currentModel.scale.set).toHaveBeenLastCalledWith(0.1, 0.1)\n\n\t\tcurrentModel.scale.set.mockClear()\n\t\tCONTROLLER.setUserScale(5)\n\t\texpect(currentModel.scale.set).toHaveBeenLastCalledWith(4, 4)\n\n\t\tawait CONTROLLER.destroy()\n',
          )

          sizing_test = 'app/desktop/Nori.Core.Tests/PetSizingTests.cs'
          replace_count(
              sizing_test,
              '\t[InlineData(1.5)]\n',
              '\t[InlineData(1.5)]\n\t[InlineData(4.0)]\n',
          )
          replace_count(
              sizing_test,
              '\t\t// On 3840x2160 screen (large enough not to clamp 85%), scales directly\n',
              '\t\t// On a large screen the requested display scale maps directly to the pet window.\n',
          )
          replace_count(
              sizing_test,
              '\t[Fact]\n\tpublic void WindowSize_ClampedByScreen85Percent()\n\t{\n\t\t// 1000x1000 screen with scale 2.0 -> max is 850x850\n\t\tvar (width, height) = PetSizing.CalculateWindowSize(600, 700, 2.0, 1000, 1000, 1.0);\n\t\tAssert.True(width <= 850);\n\t\tAssert.True(height <= 850);\n\t}\n',
              '\t[Fact]\n\tpublic void WindowSize_AllowsFourHundredPercentForDefaultPet()\n\t{\n\t\tvar (width, height) = PetSizing.CalculateWindowSize(400, 520, 4.0, 1920, 1080, 1.0);\n\t\tAssert.Equal(1600, width);\n\t\tAssert.Equal(2080, height);\n\t}\n',
          )

          render_test = 'app/desktop/Nori.Core.Tests/Live2DRenderSettingsTests.cs'
          replace_count(
              render_test,
              '\n\t[Fact]\n\tpublic void NativeSliceContainsOnlyTheTwoExistingModelIds()\n',
              '\n\t[Fact]\n\tpublic void RenderScaleSupportsFourXAndClampsAboveIt()\n\t{\n\t\tAssert.Equal(4.0f, Live2DRenderSettings.Normalize("nori", renderScale: 4.0f).RenderScale);\n\t\tAssert.Equal(4.0f, Live2DRenderSettings.Normalize("nori", renderScale: 8.0f).RenderScale);\n\t}\n\n\t[Fact]\n\tpublic void NativeSliceContainsOnlyTheTwoExistingModelIds()\n',
          )

          proactive_test = 'app/desktop/tests/settings/proactive.test.ts'
          marker = '\n\tit("handles reminder addition failure via feedback.error", async () => {'
          recurring_test = r'''

	it("creates a daily recurring reminder through the existing update API", async () => {
		const INVOKED: {cmd: string; args: any}[] = []
		;(window as any).__nori.invoke = async (cmd: string, args: any) => {
			if (cmd === "ui_get_snapshot") return RUNTIME.snapshot.value ?? createMockSnapshot()
			INVOKED.push({cmd, args})
			if (cmd === "reminder_add") {
				return {id: "rem-daily", content: args.content, triggerTime: Date.now() + args.delayMinutes * 60000}
			}
			if (cmd === "reminder_update") {
				return {id: args.id, content: "每日复习", triggerTime: Date.now() + 900000, repeatDaily: true}
			}
			return null
		}

		RUNTIME.snapshot.value = createMockSnapshot() as any

		const MOUNT = mountComponent()
		try {
			await settleView()
			const REPEAT_SWITCH = MOUNT.container.querySelector("button[role='switch'][aria-label='每日重复']") as HTMLButtonElement
			expect(REPEAT_SWITCH).not.toBeNull()
			REPEAT_SWITCH.click()
			await settleView()

			const INPUT = MOUNT.container.querySelector("input[maxlength='200']") as HTMLInputElement
			INPUT.value = "每日复习"
			INPUT.dispatchEvent(new Event("input"))
			await settleView()

			const ADD_BTN = Array.from(MOUNT.container.querySelectorAll("button"))
				.find(button => button.textContent?.includes("添加提醒"))
			ADD_BTN?.click()
			await settleView()

			expect(INVOKED.some(call => call.cmd === "reminder_add" && call.args.content === "每日复习")).toBe(true)
			expect(INVOKED.some(call => call.cmd === "reminder_update"
				&& call.args.id === "rem-daily"
				&& call.args.repeatDaily === true)).toBe(true)
		} finally {
			MOUNT.app.unmount()
			MOUNT.container.remove()
		}
	})
'''
          replace_count(proactive_test, marker, recurring_test + marker)

          # Static guardrails: no stale 2x user-scale clamps should survive in the edited paths.
          runtime_text, _ = read_text(ROOT / 'app/desktop/Nori.Desktop/Live2D/PetRuntime.cs')
          bridge_text, _ = read_text(ROOT / 'app/desktop/Nori.Desktop/Bridge/BridgeCommands.cs')
          preview_text, _ = read_text(ROOT / 'app/desktop/src/services/live2d/index.ts')
          if 'Math.Clamp(userScale, 0.1f, 2.0f)' in runtime_text or 'Math.Clamp(scale, 0.1f, 2.0f)' in runtime_text:
              raise SystemExit('PetRuntime still contains a 2x user-scale clamp')
          if 'ReadFiniteNumber(scaleElem, "模型缩放", 0.1f, 2.0f)' in bridge_text:
              raise SystemExit('BridgeCommands still rejects scale above 2x')
          if 'inner.userScale = clamp(scale, 0.1, 2)' in preview_text:
              raise SystemExit('Live2D preview still clamps scale to 2x')
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install frontend dependencies
        working-directory: app/desktop
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        working-directory: app/desktop
        run: |
          pnpm lint
          pnpm build
          pnpm test

      - name: Backend checks
        working-directory: app/desktop
        run: |
          dotnet build Nori.slnx --configuration Release
          dotnet test Nori.slnx --configuration Release --no-build --no-restore -m:1

      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/issue-30-31-agent.yml
          git add app/desktop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: resolve recurring reminders and Live2D scaling"
          git push origin HEAD:fix/issues-30-31
