name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "显式数字版本 (例如 1.0.4 或 v1.0.4)；留空则从上一数字版本按 bump 递增"
        required: false
        type: string
      bump:
        description: "未填写显式版本时的版本递增级别"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      codename:
        description: "必填唯一 Codename；用于产品版本与发布标签"
        required: true
        default: ""
        type: string
      run_extra_checks:
        description: "运行 TODO/FIXME 门禁和额外 Windows 冒烟测试"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 核心门禁仅保留版本校验、编译/单测、基础启动冒烟和标签冲突检查。
# Sentry、TODO/FIXME 与额外 Windows 冒烟按配置或输入启用，不再无条件阻塞发布。
# 分发许可确认改为仓库级 Variables，一次设置后无需每次手动勾选。
jobs:
  validate:
    name: 版本预检
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      informational: ${{ steps.version.outputs.informational }}
      sentry_release: ${{ steps.version.outputs.sentry_release }}
    env:
      # 法律/分发确认仍保留，但改成仓库级一次性 Variables，避免每次发布重复勾选。
      NORI_AVALONIA_WEBVIEW_DISTRIBUTION_LICENSE_CONFIRMED: ${{ vars.NORI_AVALONIA_WEBVIEW_DISTRIBUTION_LICENSE_CONFIRMED || 'false' }}
      NORI_CUBISM_CORE_DISTRIBUTION_LICENSE_CONFIRMED: ${{ vars.NORI_CUBISM_CORE_DISTRIBUTION_LICENSE_CONFIRMED || 'false' }}
    steps:
      - name: 检查仓库级分发许可确认
        shell: bash
        run: |
          if [ "$NORI_AVALONIA_WEBVIEW_DISTRIBUTION_LICENSE_CONFIRMED" != "true" ]; then
            echo "请先在 Repository Variables 中将 NORI_AVALONIA_WEBVIEW_DISTRIBUTION_LICENSE_CONFIRMED 设为 true。" >&2
            exit 1
          fi
          if [ "$NORI_CUBISM_CORE_DISTRIBUTION_LICENSE_CONFIRMED" != "true" ]; then
            echo "请先在 Repository Variables 中将 NORI_CUBISM_CORE_DISTRIBUTION_LICENSE_CONFIRMED 设为 true。" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - id: version
        name: 计算目标标签但暂不创建
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          CODENAME: ${{ inputs.codename }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          numeric_pattern='^[vV]?[0-9]+\.[0-9]+\.[0-9]+$'
          tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$'
          codename_pattern='^[A-Za-z0-9][A-Za-z0-9.-]*$'
          codename="$CODENAME"
          if [ -z "$codename" ] || [[ ! "$codename" =~ $codename_pattern ]]; then
            echo "Release 必须提供唯一 Codename，且只能包含字母、数字、点和连字符: $codename" >&2
            exit 1
          fi

          latest="$(git tag --list 'v*' | grep -E "$tag_pattern" | sed -E 's/-[A-Za-z0-9][A-Za-z0-9.-]*$//' | sort -V | tail -n1 || true)"
          if [ -n "$VERSION_INPUT" ]; then
            if [[ ! "$VERSION_INPUT" =~ $numeric_pattern ]]; then
              echo "显式版本必须是 major.minor.patch 数字版本: $VERSION_INPUT" >&2
              exit 1
            fi
            version="${VERSION_INPUT#v}"
            version="${version#V}"
          else
            if [ -z "$latest" ]; then
              echo "没有历史数字版本；Release 必须显式提供版本，拒绝隐式初始版本。" >&2
              exit 1
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              case "$BUMP" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
                *) echo "不支持的递增级别: $BUMP" >&2; exit 1 ;;
              esac
              version="$major.$minor.$patch"
            fi
          fi

          node app/desktop/scripts/validate-publish-input.mjs "$version" 0 win-x64
          if [ -n "$codename" ]; then
            tag="v$version-$codename"
            stable_version="$version-$codename"
            while IFS= read -r historical_tag; do
              historical_codename="${historical_tag#v}"
              historical_codename="${historical_codename#*-}"
              if [ "$historical_codename" = "$codename" ] && [ "$historical_tag" != "$tag" ]; then
                echo "Codename 已在历史标签中使用: $historical_tag" >&2
                exit 1
              fi
            done < <(git tag --list 'v[0-9]*-*')
          else
            tag="v$version"
            stable_version="$version"
          fi
          node app/desktop/scripts/validate-publish-input.mjs "$stable_version" 0 win-x64 linux-x64 osx-arm64
          while IFS= read -r historical_version_tag; do
            if [ -n "$historical_version_tag" ] && [ "$historical_version_tag" != "$tag" ]; then
              echo "数字版本已由其它发布标签使用，会与 revision 0 槽冲突: $historical_version_tag" >&2
              exit 1
            fi
          done < <(git tag --list "v$version" "v$version-*")
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            tagged_sha="$(git rev-list -n1 "refs/tags/$tag")"
            if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
              echo "目标标签已存在且没有指向本次 workflow 的提交: $tag" >&2
              exit 1
            fi
          fi
          short_sha="$(git rev-parse --short=7 "$GITHUB_SHA")"
          informational="v$stable_version+$short_sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$stable_version" >> "$GITHUB_OUTPUT"
          echo "informational=$informational" >> "$GITHUB_OUTPUT"
          # Sentry 只按数字产品版本聚合事件；Codename 仅用于产品版本、标签和产物名。
          # Sentry 服务端只有 package@version 格式才解析 semver（裸版本号 Semver 恒为否）。
          echo "sentry_release=nori@$version" >> "$GITHUB_OUTPUT"
          echo "目标版本: $stable_version"
          echo "Sentry release: nori@$version (不含 Codename)"
          echo "程序 informational version: $informational (标签将在所有测试通过后创建)"

  preflight:
    name: Ubuntu 四道门与前端产物
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/desktop
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      VITE_SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
      NORI_SENTRY_RELEASE: ${{ needs.validate.outputs.sentry_release }}
      NORI_PRODUCT_VERSION: ${{ needs.validate.outputs.version }}
      NORI_PRODUCT_INFORMATIONAL_VERSION: ${{ needs.validate.outputs.informational }}
      NORI_COMMIT_SHA: ${{ github.sha }}
      NORI_SENTRY_ENVIRONMENT: production
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT_WEB: ${{ secrets.SENTRY_PROJECT_WEB }}
      SENTRY_URL: ${{ secrets.SENTRY_URL || 'https://sentry.io' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: sentry_web
        name: 检测 Web Sentry 配置
        shell: bash
        run: |
          enabled=true
          for name in VITE_SENTRY_DSN_WEB SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT_WEB; do
            if [ -z "${!name}" ]; then
              echo "未配置 $name；本次发布不强制 Web Sentry 上传。"
              enabled=false
            fi
          done
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: 缓存 NuGet 全局包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/desktop/**/*.csproj', 'app/desktop/Directory.Build.props', 'app/desktop/version.props', 'app/desktop/Nori.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 一方 TODO/FIXME 门禁（可选）
        if: inputs.run_extra_checks
        run: pnpm check:todo
      - name: 前端门 · 类型检查与构建
        run: pnpm build
      - name: 前端门 · 单元测试
        run: pnpm test
      - name: 发布结构 fixture 门
        run: node scripts/validate-publish-structure.test.mjs
      - name: 自动更新清单 fixture 门
        run: node scripts/generate-update-manifest.test.mjs
      # dotnet 调用不并行, 且 test 不再触发第二次 build, 避免 obj 锁冲突。
      - name: 后端门 · 构建
        run: dotnet build Nori.slnx --configuration Release
      - name: 后端门 · 单元测试
        run: dotnet test Nori.slnx --configuration Release --no-build --no-restore
      - name: 处理 source map
        shell: bash
        run: |
          if [ "${{ steps.sentry_web.outputs.enabled }}" = "true" ]; then
            if find dist -name '*.map' -print -quit | grep -q .; then
              echo "Sentry 已启用，但 source map 仍留在 dist 中。" >&2
              exit 1
            fi
          else
            # 未启用 Sentry 时也不把 source map 放进公开发布产物。
            find dist -name '*.map' -delete
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nori-dist-${{ needs.validate.outputs.version }}
          path: app/desktop/dist
          if-no-files-found: error
          retention-days: 2

  native:
    name: ${{ matrix.name }} 编译与单测
    needs: [validate, preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            rid: win-x64
          - os: ubuntu-latest
            name: linux
            rid: linux-x64
          - os: macos-14
            name: macos
            rid: osx-arm64
    defaults:
      run:
        working-directory: app/desktop
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NORI_VERSION: ${{ needs.validate.outputs.version }}
      NORI_PRODUCT_VERSION: ${{ needs.validate.outputs.version }}
      NORI_PRODUCT_INFORMATIONAL_VERSION: ${{ needs.validate.outputs.informational }}
      NORI_COMMIT_SHA: ${{ github.sha }}
      NORI_SENTRY_DSN_NATIVE: ${{ secrets.SENTRY_DSN_NATIVE }}
      NORI_SENTRY_RELEASE: ${{ needs.validate.outputs.sentry_release }}
      NORI_SENTRY_ENVIRONMENT: production
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT_NATIVE: ${{ secrets.SENTRY_PROJECT_NATIVE }}
      SENTRY_URL: ${{ secrets.SENTRY_URL || 'https://sentry.io' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: nori-dist-${{ needs.validate.outputs.version }}
          path: app/desktop/dist
      - name: 安装 Linux 原生编译依赖
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: 缓存 NuGet 全局包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/desktop/**/*.csproj', 'app/desktop/Directory.Build.props', 'app/desktop/version.props', 'app/desktop/Nori.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: 后端门 · 跨平台构建
        run: dotnet build Nori.slnx --configuration Release
      - name: 后端门 · 跨平台单元测试
        run: dotnet test Nori.slnx --configuration Release --no-build --no-restore

      - name: Native Sentry 配置提示
        shell: bash
        run: |
          missing=0
          for name in NORI_SENTRY_DSN_NATIVE SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT_NATIVE; do
            if [ -z "${!name}" ]; then echo "未配置 $name；相关 Sentry 功能将跳过。"; missing=1; fi
          done
          if [ "$missing" -eq 0 ]; then echo "Native Sentry 配置完整。"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Windows 发布目标还原
        if: matrix.name == 'windows'
        run: dotnet restore Nori.Desktop/Nori.Desktop.csproj --runtime win-x64
      - name: Windows 槽式 framework-dependent 发布
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $env:NORI_SKIP_FRONTEND = "1"
          $env:NORI_KEEP_SYMBOLS = "1"
          cmd /c publish.bat
      - name: 上传 Windows Native Sentry 符号（可选）
        if: matrix.name == 'windows' && env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT_NATIVE != ''
        shell: pwsh
        run: |
          $cli = Get-ChildItem "$env:USERPROFILE\.nuget\packages\sentry\6.9.0\tools\sentry-cli-Windows-*.exe" | Select-Object -First 1
          if ($null -eq $cli) { throw '找不到 Sentry CLI' }
          & $cli.FullName debug-files upload --org $env:SENTRY_ORG --project $env:SENTRY_PROJECT_NATIVE --type portablepdb bin/publish/win-x64
          if ($LASTEXITCODE -ne 0) { throw "Sentry 符号上传失败: $LASTEXITCODE" }
      - name: 从 Windows 发布目录移除 PDB
        if: matrix.name == 'windows'
        shell: pwsh
        run: Get-ChildItem bin/publish/win-x64 -Recurse -Filter *.pdb | Remove-Item -Force
      - name: Windows ZIP / checksum / SBOM / third-party notices
        if: matrix.name == 'windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -PublishDir bin/publish/win-x64 -Version $env:NORI_VERSION -OutputDir bin/release
      - name: Windows first-run 启动冒烟
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "nori-release-smoke-first-run-$env:GITHUB_RUN_ID"
          ./scripts/smoke-published.ps1 -BinaryPath bin/publish/win-x64/Nori.exe -Mode first-run -Profile $profile -ExpectedVersion $env:NORI_PRODUCT_INFORMATIONAL_VERSION
      - name: Windows initialized 启动冒烟（可选）
        if: matrix.name == 'windows' && inputs.run_extra_checks
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "nori-release-smoke-initialized-$env:GITHUB_RUN_ID"
          ./scripts/smoke-published.ps1 -BinaryPath bin/publish/win-x64/Nori.exe -Mode initialized -Profile $profile -ExpectedVersion $env:NORI_PRODUCT_INFORMATIONAL_VERSION
      - name: Windows safe-mode 启动冒烟（可选）
        if: matrix.name == 'windows' && inputs.run_extra_checks
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "nori-release-smoke-safe-mode-$env:GITHUB_RUN_ID"
          ./scripts/smoke-published.ps1 -BinaryPath bin/publish/win-x64/Nori.exe -Mode initialized -Profile $profile -ExpectedVersion $env:NORI_PRODUCT_INFORMATIONAL_VERSION -SafeMode

      - name: 上传待发布 Windows 产物
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: nori-windows-release-${{ needs.validate.outputs.version }}
          path: |
            app/desktop/bin/release/*.zip
            app/desktop/bin/release/*.sha256
            app/desktop/bin/release/SBOM.cdx.json
            app/desktop/bin/release/THIRD-PARTY-NOTICES.json
            app/desktop/bin/release/THIRD-PARTY-NOTICES.md
            app/desktop/bin/release/RELEASE-MANIFEST.json
            app/desktop/bin/release/SBOM-win-x64.cdx.json
            app/desktop/bin/release/THIRD-PARTY-NOTICES-win-x64.json
            app/desktop/bin/release/THIRD-PARTY-NOTICES-win-x64.md
            app/desktop/bin/release/RELEASE-MANIFEST-win-x64.json
            app/desktop/bin/release/UPDATE-win-x64.json
          if-no-files-found: error
          retention-days: 2

      - name: 发布 Linux/macOS framework-dependent 产物
        if: matrix.name != 'windows'
        shell: bash
        run: |
          test -f dist/index.html
          chmod +x publish.sh
          NORI_SKIP_FRONTEND=1 NORI_KEEP_SYMBOLS=1 ./publish.sh "${{ matrix.rid }}"
      - name: 上传 Linux/macOS Native Sentry 符号（可选）
        if: matrix.name != 'windows' && env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT_NATIVE != ''
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "linux" ]; then
            cli="$HOME/.nuget/packages/sentry/6.9.0/tools/sentry-cli-Linux-x86_64"
          else
            cli="$HOME/.nuget/packages/sentry/6.9.0/tools/sentry-cli-Darwin-arm64"
          fi
          test -f "$cli"
          chmod +x "$cli"
          "$cli" debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_NATIVE" --type portablepdb "bin/publish/${{ matrix.rid }}"
      - name: 移除 Linux/macOS 发布包中的符号
        if: matrix.name != 'windows'
        shell: bash
        run: find "bin/publish/${{ matrix.rid }}" -name '*.pdb' -delete
      - name: 打包 Linux/macOS Release 资产
        if: matrix.name != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          output="bin/release"
          rm -rf "$output"
          mkdir -p "$output"

          publish="bin/publish/$rid"
          node scripts/validate-publish-structure.mjs "$publish" "$rid"
          if [ "${{ matrix.name }}" = "linux" ]; then
            archive="$output/nori-${NORI_VERSION}-${rid}.tar.gz"
            tar -czf "$archive" -C "$publish" .
          else
            archive="$output/nori-${NORI_VERSION}-${rid}.zip"
            (cd "$publish" && zip -qry "$GITHUB_WORKSPACE/app/desktop/$archive" .)
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            hash="$(sha256sum "$archive" | awk '{print $1}')"
          else
            hash="$(shasum -a 256 "$archive" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$hash" "$(basename "$archive")" > "$archive.sha256"
          metadata="bin/release/.metadata-$rid"
          rm -rf "$metadata"
          node scripts/generate-release-metadata.mjs --publish-dir "$publish" --version "$NORI_VERSION" --rid "$rid" --output-dir "$metadata"
          cp "$metadata/SBOM.cdx.json" "bin/release/SBOM-$rid.cdx.json"
          cp "$metadata/THIRD-PARTY-NOTICES.json" "bin/release/THIRD-PARTY-NOTICES-$rid.json"
          cp "$metadata/THIRD-PARTY-NOTICES.md" "bin/release/THIRD-PARTY-NOTICES-$rid.md"
          cp "$metadata/RELEASE-MANIFEST.json" "bin/release/RELEASE-MANIFEST-$rid.json"
          rm -rf "$metadata"
          node scripts/generate-update-manifest.mjs --version "$NORI_VERSION" --rid "$rid" --archive-path "$archive" --publish-dir "$publish" --output-dir "bin/release"
          echo "已生成 $archive 及 $rid 发布元数据"
      - name: 上传待发布 Linux/macOS 产物
        if: matrix.name != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: nori-${{ matrix.name }}-release-${{ needs.validate.outputs.version }}
          path: |
            app/desktop/bin/release/*.zip
            app/desktop/bin/release/*.tar.gz
            app/desktop/bin/release/*.sha256
            app/desktop/bin/release/SBOM-${{ matrix.rid }}.cdx.json
            app/desktop/bin/release/THIRD-PARTY-NOTICES-${{ matrix.rid }}.json
            app/desktop/bin/release/THIRD-PARTY-NOTICES-${{ matrix.rid }}.md
            app/desktop/bin/release/RELEASE-MANIFEST-${{ matrix.rid }}.json
            app/desktop/bin/release/UPDATE-${{ matrix.rid }}.json
          if-no-files-found: error
          retention-days: 2

  create_tag:
    name: 所有测试通过后创建标签
    needs: [validate, preflight, native]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 创建并推送标签
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            tagged_sha="$(git rev-list -n1 "refs/tags/$TAG")"
            if [ "$tagged_sha" != "$GITHUB_SHA" ]; then echo "标签指向错误提交: $TAG" >&2; exit 1; fi
            echo "复用已指向本次提交的标签: $TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "chore: release $TAG"
            git push origin "$TAG"
          fi

  finalize_sentry:
    name: 完成 Native Sentry release（可选）
    needs: [create_tag, validate]
    runs-on: ubuntu-latest
    env:
      NORI_SENTRY_RELEASE: ${{ needs.validate.outputs.sentry_release }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT_NATIVE: ${{ secrets.SENTRY_PROJECT_NATIVE }}
      SENTRY_URL: ${{ secrets.SENTRY_URL || 'https://sentry.io' }}
    steps:
      - name: 未配置 Sentry 时跳过
        if: env.SENTRY_AUTH_TOKEN == '' || env.SENTRY_ORG == '' || env.SENTRY_PROJECT_NATIVE == ''
        run: echo "Native Sentry 未完整配置，跳过 release finalize。"
      - uses: actions/checkout@v4
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT_NATIVE != ''
        with:
          ref: ${{ needs.create_tag.outputs.tag }}
      - uses: actions/setup-dotnet@v4
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT_NATIVE != ''
        with:
          dotnet-version: "10.0.x"
      - name: 缓存 NuGet 全局包
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT_NATIVE != ''
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/desktop/**/*.csproj', 'app/desktop/Directory.Build.props', 'app/desktop/version.props', 'app/desktop/Nori.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: 创建或复用并完成 Native release
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT_NATIVE != ''
        shell: bash
        run: |
          dotnet restore app/desktop/Nori.Desktop/Nori.Desktop.csproj
          cli="$HOME/.nuget/packages/sentry/6.9.0/tools/sentry-cli-Linux-x86_64"
          test -f "$cli"
          chmod +x "$cli"
          if ! "$cli" releases new --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_NATIVE" "$NORI_SENTRY_RELEASE"; then
            "$cli" releases info --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_NATIVE" "$NORI_SENTRY_RELEASE" >/dev/null
          fi
          "$cli" releases finalize --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_NATIVE" "$NORI_SENTRY_RELEASE"

  publish_release:
    name: 创建 GitHub Release
    needs: [create_tag, finalize_sentry, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "nori-*-release-${{ needs.validate.outputs.version }}"
          path: release-artifacts
          merge-multiple: true
      - name: 发布 Windows、Linux、macOS 产物与审计元数据
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create_tag.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          assets=(
            release-artifacts/nori-${VERSION}-win-x64-framework-dependent.zip
            release-artifacts/nori-${VERSION}-win-x64-framework-dependent.zip.sha256
            release-artifacts/nori-${VERSION}-linux-x64.tar.gz
            release-artifacts/nori-${VERSION}-linux-x64.tar.gz.sha256
            release-artifacts/nori-${VERSION}-osx-arm64.zip
            release-artifacts/nori-${VERSION}-osx-arm64.zip.sha256
            release-artifacts/SBOM-win-x64.cdx.json
            release-artifacts/THIRD-PARTY-NOTICES-win-x64.json
            release-artifacts/THIRD-PARTY-NOTICES-win-x64.md
            release-artifacts/RELEASE-MANIFEST-win-x64.json
            release-artifacts/SBOM-linux-x64.cdx.json
            release-artifacts/THIRD-PARTY-NOTICES-linux-x64.json
            release-artifacts/THIRD-PARTY-NOTICES-linux-x64.md
            release-artifacts/RELEASE-MANIFEST-linux-x64.json
            release-artifacts/SBOM-osx-arm64.cdx.json
            release-artifacts/THIRD-PARTY-NOTICES-osx-arm64.json
            release-artifacts/THIRD-PARTY-NOTICES-osx-arm64.md
            release-artifacts/RELEASE-MANIFEST-osx-arm64.json
            release-artifacts/UPDATE-win-x64.json
            release-artifacts/UPDATE-linux-x64.json
            release-artifacts/UPDATE-osx-arm64.json
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title "$TAG"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --generate-notes "${assets[@]}"
          fi
